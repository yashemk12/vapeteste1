<!doctype html><html lang="pt-BR"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><title>Rastrear pedido — VapeCloud</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap"><style>:root{color-scheme:dark}*{box-sizing:border-box;margin:0;padding:0}body{background:#0a0b12;color:#e8e9f5;font:16px/1.6 'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:#b06dff;text-decoration:none}.top{display:flex;align-items:center;justify-content:space-between;padding:16px max(20px);border-bottom:1px solid rgba(120,116,255,.16);position:sticky;top:0;background:rgba(10,11,18,.8);backdrop-filter:blur(16px)}.logo{font-family:Syne,system-ui;font-weight:800;font-size:1.2rem;background:linear-gradient(130deg,#fff 30%,#b06dff);-webkit-background-clip:text;background-clip:text;color:transparent}.main{max-width:760px;margin:0 auto;padding:34px max(20px) 60px}h1{font-family:Syne,system-ui;font-size:2rem;margin-bottom:14px;letter-spacing:-.02em}h2{font-family:Syne,system-ui;font-size:1.2rem;margin:22px 0 8px}p,li{color:#b9bce0;margin-bottom:10px}ul,ol{padding-left:20px}.card{background:#14152b;border:1px solid rgba(120,116,255,.16);border-radius:16px;padding:18px;margin-bottom:14px}footer{text-align:center;color:#7c7fa8;font-size:.8rem;padding:26px;line-height:1.7}input,button{font:inherit}</style><style id="vicss">.vi{width:1.06em;height:1.06em;vertical-align:-.16em;display:inline-block;flex:none}.vs{width:.9em;height:.9em;vertical-align:-.08em;display:inline-block;margin:0 .3px}</style></head><body><div class="top"><a class="logo" href="/">VapeCloud</a><a href="/rastreio.html">Rastrear pedido</a></div><div class="main"><h1>Rastrear pedido</h1><p>Digite o número do pedido que veio na confirmação.</p><div class="card"><input id="n" placeholder="Ex.: 1 ou 0001" style="width:100%;background:#0a0b12;border:1px solid rgba(120,116,255,.2);border-radius:12px;padding:13px;color:#e8e9f5"><button id="go" style="margin-top:10px;width:100%;background:linear-gradient(135deg,#6c63ff,#b06dff);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:700">Buscar</button><div id="out" style="margin-top:16px"></div></div><script>
window.__vcTrack=function(out,o){
  var n=String(o.n||''),criado=o.criado||Date.now(),dst=o.cidade||'',uf=o.uf||'',TOTAL=7*864e5;
  var $el=function(id){return document.getElementById(id)};
  var dstr=function(d){return d.toLocaleDateString('pt-BR')};
  var dts=function(d){return d.toLocaleDateString('pt-BR')+' '+d.toTimeString().slice(0,5)};
  var STG=[['<svg class="vi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 6l5 5"/></svg>','Pedido em preparação para envio'],['<svg class="vi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v10l-8 4-8-4V7z"/><path d="M4 7l8 4 8-4M12 21V11"/></svg>','Postado — saiu de São Paulo/SP'],['<svg class="vi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="6" width="13" height="10" rx="1"/><path d="M14 9h4l3 3v4h-7"/><circle cx="6" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg>','Em trânsito nacional'],['<svg class="vi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-5-4.5-7-8-7-11a7 7 0 0 1 14 0c0 3-2 6.5-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>','Chegou a '+(dst?(dst+' '+(uf?'/'+uf:'')):'sua região')],['<svg class="vi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>','Em rota final de entrega na sua região'],['<svg class="vi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>','Agendado para entrega'],['<svg class="vi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="2.4"/><circle cx="18" cy="17" r="2.4"/><path d="M9 17h6l3-7h3M6 17l3-8h4"/></svg>','Em saída para entrega'],['<svg class="vi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 5-6"/></svg>','Entregue']];
  function state(){var now=Date.now(),el=now-criado,dd=Math.max(0,Math.floor(el/864e5));return{idx:Math.min(STG.length-1,dd),pct:Math.max(3,Math.min(100,el/TOTAL*100)),rem:Math.max(0,TOTAL-el),delivered:dd>=7,eta:new Date(criado+TOTAL)}}
  function cd(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600);s-=h*3600;var m=Math.floor(s/60);s-=m*60;function z(x){return(x<10?'0':'')+x}return z(h)+':'+z(m)+':'+z(s)}
  function render(){var st=state(),i=st.idx,h='<div style="font-size:.9rem;line-height:1.5">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b style="font-size:1rem">Pedido #'+n+'</b><span style="font-size:.72rem;color:#7c7fa8">'+(st.delivered?'concluído':'acompanhamento ao vivo')+'</span></div>';
    h+='<div style="background:rgba(124,127,168,.18);border-radius:99px;height:12px;overflow:hidden;margin-bottom:6px"><div id="trk-fill" style="height:100%;width:'+st.pct.toFixed(1)+'%;border-radius:99px;background:linear-gradient(90deg,#6c63ff,#b06dff);transition:width .8s ease"></div></div>';
    h+='<div style="display:flex;justify-content:space-between;font-size:.72rem;color:#7c7fa8;margin-bottom:14px"><span>'+(st.delivered?'pedido entregue':('previsão de entrega '+dstr(st.eta)))+'</span></div>';
    h+='<ol style="list-style:none;margin:0 0 0 6px;padding:0 0 0 20px;border-left:2px solid rgba(124,127,168,.35)">';
    for(var k=0;k<STG.length;k++){var done=k<i,cu=k===i;h+='<li style="position:relative;padding:0 0 14px;font-size:.85rem;color:'+(k<=i?'#e8e9f5':'#7c7fa8')+';'+(cu?'font-weight:700':'')+'"><span style="position:absolute;left:-25px;top:1px;width:11px;height:11px;border-radius:50%;background:'+(done?'#22c55e':(cu?'#6c63ff':'#2a2c4a'))+';box-shadow:0 0 0 3px '+(cu?'rgba(108,99,255,.25)':'transparent')+'"></span>'+(done?'✓ ':((cu)?'● ':''))+STG[k][1]+'</li>'}
    h+='</ol>';
    if(st.delivered){h+='<div style="margin-top:6px;font-size:.85rem;line-height:1.6;background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.35);border-radius:12px;padding:12px 14px"><b><svg class="vi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 5-6"/></svg> Entregue</b><br>Entregue na data prevista · '+dts(st.eta)+'</div>'}
    else{h+='<div style="margin-top:6px;font-size:.85rem;line-height:1.6;background:rgba(108,99,255,.08);border:1px solid rgba(124,127,168,.35);border-radius:12px;padding:12px 14px">Última movimentação: <b>'+STG[i][1]+'</b><br><span style="color:#7c7fa8">data prevista de entrega: <b>'+dstr(st.eta)+'</b></span></div>'}
    h+='</div>';out.innerHTML=h;}
  render();
  if(window.__vcTIV){clearInterval(window.__vcTIV);window.__vcTIV=null}
};
(function(){var out=document.getElementById("out");function $(id){return document.getElementById(id)}function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}async function go(){var n=$("n").value.trim();if(!n){out.innerHTML="<p style=color:#ff9c9c>Digite um número.</p>";return}out.innerHTML="Buscando…";try{var r=await fetch("/api/track?n="+encodeURIComponent(n));var j=await r.json();if(!j.ok){out.innerHTML="<p style=color:#ff9c9c>"+esc(j.error||"não encontrado")+"</p>";return}window.__vcTrack(out,{n:j.numero,criado:j.criado,cidade:j.cidade,uf:j.uf})}catch(e){out.innerHTML="<p style=color:#ff9c9c>Erro ao buscar.</p>"}}$("go").onclick=go;$("n").addEventListener("keydown",function(e){if(e.key==="Enter")go()});var q=new URLSearchParams(location.search).get("n");if(q){$("n").value=q;go()}})();
</script></div><footer>Venda exclusiva para maiores de 18 anos · Produto sujeito à regulamentação da Anvisa.<br>Acompanhe seu pedido na <a href="/rastreio.html">página de rastreamento</a>.</footer></body></html>
